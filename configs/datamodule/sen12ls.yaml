# configs/datamodule/sen12ls.yaml
_target_: src.data.datamodule.Sen12LsDataModule
root_dir: ${root_dir}
dataset_cfg: ${dataset}
batch_size: 16
num_workers: 8
train_transforms:
  _target_: torchvision.transforms.Compose 
  transforms:
    - _target_: src.data.transforms.RandomHorizontalFlip
      p: 0.5
    - _target_: src.data.transforms.RandomVerticalFlip
      p: 0.5
    - _target_: src.data.transforms.RandomRotate90
      p: 0.5
    - _target_: src.data.transforms.GlobalNormalize
      stats_json: ${hydra:runtime.output_dir}/results/E7_global_normalization_stats.json
      clip: 5.0
val_transforms: 
  _target_: torchvision.transforms.Compose 
  transforms:
    - _target_: src.data.transforms.GlobalNormalize
      stats_json: ${hydra:runtime.output_dir}/results/E7_global_normalization_stats.json
      clip: 5.0
test_transforms:
  _target_: torchvision.transforms.Compose 
  transforms:
  - _target_: src.data.transforms.GlobalNormalize
    stats_json: ${hydra:runtime.output_dir}/results/E7_global_normalization_stats.json
    clip: 5.0
pin_memory: true
normalization: global
global_stats_path: ${hydra:runtime.output_dir}/results/E7_global_normalization_stats.json
global_clip: 5.0